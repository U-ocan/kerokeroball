<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KerokeroBall - Refined Edition</title>
    <style>
        body { margin: 0; background: #2c3e50; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: sans-serif; }
        canvas { background: #87ceeb; border: 4px solid #27ae60; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); max-width: 95vw; max-height: 85vh; }
        #ui { position: absolute; top: 20px; color: white; text-align: center; pointer-events: none; z-index: 10; width: 100%; }
    </style>
</head>
<body>
    <div id="ui">
        <h2 style="margin:0; font-size: 1.2rem;">KerokeroBall</h2>
        <div id="score">Score: 0</div>
        <div id="msg" style="font-size: 0.8rem; margin-top:5px; color: #ffeb3b; font-weight: bold;">TAP OR PRESS ANY KEY TO ENABLE SOUND</div>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const msgEl = document.getElementById('msg');

        canvas.width = 360; 
        canvas.height = 660; 

        function drawRoundedRect(x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
            ctx.fill();
        }

        const keroAudio = new Audio('https://raw.githubusercontent.com/U-ocan/kerokeroball/main/kero.m4a');
        keroAudio.preload = 'auto';
        let soundEnabled = false;

        function enableSound() {
            if (!soundEnabled) {
                soundEnabled = true;
                if (msgEl) msgEl.style.display = 'none';
                keroAudio.play().then(() => { keroAudio.pause(); keroAudio.currentTime = 0; }).catch(() => {});
            }
        }

        function playKeroSound(rate = 1.0) {
            if (!soundEnabled) return;
            try {
                const soundClone = keroAudio.cloneNode(true);
                soundClone.playbackRate = rate;    
                soundClone.preservesPitch = false; 
                soundClone.volume = 0.5; 
                soundClone.play().catch(() => {});
            } catch (e) {}
        }

        const gravity = 0.45; 
        const airFriction = 0.99; 
        let score = 0;
        let floatingTexts = [];

        const laneX = 325;               
        const fieldCenterX = laneX / 2; 
        const slingWidth = 50;                     
        const leftFlipperX = slingWidth;         
        const rightFlipperX = laneX - slingWidth; 
        const flipperLen = 112; 
        const flipperThickness = 20; 

        const frogImg = new Image();
        frogImg.crossOrigin = "anonymous"; 
        frogImg.src = 'https://raw.githubusercontent.com/U-ocan/kerokeroball/main/frog.PNG'; 
        let imgLoaded = false;
        frogImg.onload = () => { imgLoaded = true; };

        const ball = { x: 342, y: 560, vx: 0, vy: 0, radius: 16, isLocked: true, holeTimer: 0, holeCooldown: 0 };

        class FloatingText {
            constructor(x, y, text) {
                this.x = x; this.y = y; this.text = text;
                this.life = 1.0; this.vY = -1.2; this.scale = 0.5;
            }
            update() { this.y += this.vY; this.life -= 0.025; if (this.scale < 1.0) this.scale += 0.1; }
            draw() {
                ctx.save(); ctx.globalAlpha = this.life; ctx.fillStyle = "#ffffff";
                ctx.font = `bold ${22 * this.scale}px sans-serif`; ctx.textAlign = "center";
                ctx.shadowColor = "rgba(0,0,0,0.3)"; ctx.shadowBlur = 4;
                ctx.fillText(this.text, this.x, this.y); ctx.restore();
            }
        }

        class Flipper {
            constructor(x, y, length, angle, side) {
                this.x = x; this.y = y; this.length = length;
                this.baseAngle = angle; this.angle = angle;
                this.side = side; this.targetAngle = angle;
                this.prevAngle = angle; this.angularVelocity = 0;
            }
            update() {
                this.prevAngle = this.angle;
                const speed = 0.48; 
                const diff = this.targetAngle - this.angle;
                this.angularVelocity = diff * speed;
                this.angle += this.angularVelocity;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                if (this.side === -1) ctx.scale(-1, 1);
                ctx.fillStyle = '#27ae60';
                drawRoundedRect(0, -flipperThickness/2, this.length, flipperThickness, flipperThickness/2);
                ctx.restore();
            }
        }

        const laneExitY = 120; 
        const plunger = { y: 585, minY: 585, maxY: 645, isCharging: false, k: 3.8 };
        const flipY = 560; 
        const leftFlipper = new Flipper(leftFlipperX, flipY, flipperLen, 0.6, 1);
        const rightFlipper = new Flipper(rightFlipperX, flipY, flipperLen, -0.6, -1);
        const bumpers = [{ x: fieldCenterX - 75, y: 180, r: 35, scale: 1.0 }, { x: fieldCenterX + 75, y: 180, r: 35, scale: 1.0 }, { x: fieldCenterX, y: 320, r: 45, scale: 1.0 }];
        const kickoutHole = { x: fieldCenterX, y: 90, r: 24 };
        const slingTop = flipY - 105;

        function resetBall() {
            ball.x = 342; ball.y = plunger.minY - ball.radius - 2;
            ball.vx = 0; ball.vy = 0; ball.isLocked = true; 
            ball.holeTimer = 0; ball.holeCooldown = 0;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#218c74';
            ctx.beginPath(); ctx.ellipse(180, 655, 250, 60, 0, 0, Math.PI * 2); ctx.fill();

            ctx.strokeStyle = '#27ae60'; ctx.lineWidth = 8; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(laneX, canvas.height); ctx.lineTo(laneX, laneExitY); ctx.stroke();

            ctx.fillStyle = '#7f8c8d'; ctx.fillRect(laneX + 5, plunger.y, 25, 12); 
            ctx.strokeStyle = '#bdc3c7'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(laneX + 17.5, plunger.y + 12);
            for (let i = 1; i <= 12; i++) {
                ctx.lineTo(laneX + 17.5 + (i % 2 === 0 ? 8 : -8), plunger.y + 12 + (i * (canvas.height - (plunger.y + 12)) / 12));
            }
            ctx.stroke();

            const slingData = [
                {p1:{x:0, y:slingTop}, p2:{x:slingWidth, y:flipY}, p3:{x:0, y:flipY}},
                {p1:{x:laneX, y:slingTop}, p2:{x:laneX - slingWidth, y:flipY}, p3:{x:laneX, y:flipY}}
            ];
            slingData.forEach(s => {
                ctx.fillStyle = '#2ecc71'; ctx.beginPath();
                ctx.moveTo(s.p1.x, s.p1.y); ctx.lineTo(s.p2.x, s.p2.y); ctx.lineTo(s.p3.x, s.p3.y); ctx.fill();
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 6; ctx.lineCap = 'round';
                ctx.beginPath(); ctx.moveTo(s.p1.x, s.p1.y + 5); ctx.lineTo(s.p2.x, s.p2.y - 5); ctx.stroke();
            });

            ctx.save();
            ctx.translate(kickoutHole.x, kickoutHole.y);
            ctx.fillStyle = '#333333'; 
            ctx.beginPath(); ctx.arc(0, 0, kickoutHole.r, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#27ae60'; 
            ctx.lineWidth = 4; ctx.stroke();
            if (ball.holeTimer > 0) {
                ctx.fillStyle = 'rgba(39, 174, 96, 0.4)';
                ctx.beginPath(); ctx.arc(0, 0, kickoutHole.r * (ball.holeTimer / 60), 0, Math.PI * 2); ctx.fill();
            }
            ctx.restore();

            bumpers.forEach(b => {
                ctx.save();
                ctx.translate(b.x, b.y);
                ctx.scale(b.scale, b.scale);
                if (imgLoaded) {
                    const size = b.r * 2.2;
                    ctx.drawImage(frogImg, -size/2, -size/2, size, size);
                } else {
                    ctx.fillStyle = '#2ecc71';
                    ctx.beginPath(); ctx.arc(0, 0, b.r, 0, Math.PI * 2); ctx.fill();
                }
                ctx.restore();
                b.scale += (1.0 - b.scale) * 0.15;
            });
            
            leftFlipper.draw(); rightFlipper.draw();

            floatingTexts = floatingTexts.filter(t => t.life > 0);
            floatingTexts.forEach(t => { t.update(); t.draw(); });

            ctx.save(); ctx.translate(ball.x, ball.y); 
            const drawRadius = ball.holeTimer > 0 ? ball.radius * 0.8 : ball.radius;
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath(); ctx.arc(0, 0, drawRadius, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#000000'; ctx.lineWidth = 2; ctx.stroke();
            ctx.fillStyle = '#708090'; ctx.beginPath(); ctx.arc(0, 0, drawRadius * 0.5, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        }

        function update() {
            if (plunger.isCharging) {
                if (plunger.y < plunger.maxY) plunger.y += 3; 
                if (ball.isLocked) ball.y = plunger.y - ball.radius - 2;
            } else {
                if (plunger.y > plunger.minY) {
                    if (ball.isLocked) {
                        const power = (plunger.y - plunger.minY) * plunger.k + 22;
                        ball.vy = -power;
                        ball.isLocked = false;
                        playKeroSound(1.0); 
                    }
                    plunger.y -= 45; 
                } else { plunger.y = plunger.minY; }
            }

            if (ball.holeTimer > 0) {
                ball.holeTimer--;
                ball.x = kickoutHole.x; ball.y = kickoutHole.y;
                ball.vx = 0; ball.vy = 0;
                if (ball.holeTimer === 0) {
                    ball.vy = -16; ball.vx = (Math.random() - 0.5) * 8;
                    ball.holeCooldown = 30;
                    score += 50; scoreEl.innerText = `Score: ${score}`;
                    floatingTexts.push(new FloatingText(kickoutHole.x, kickoutHole.y - 30, `+50`));
                    playKeroSound(1.6);
                }
            } else {
                if (!ball.isLocked) {
                    ball.vy += gravity; ball.x += ball.vx; ball.y += ball.vy;
                    ball.vx *= airFriction; ball.vy *= airFriction;
                }
                if (ball.holeCooldown > 0) ball.holeCooldown--;
                else if (!ball.isLocked) {
                    const hdx = ball.x - kickoutHole.x; const hdy = ball.y - kickoutHole.y;
                    if (Math.sqrt(hdx * hdx + hdy * hdy) < kickoutHole.r * 0.8) {
                        ball.holeTimer = 60; playKeroSound(0.5);
                    }
                }
            }

            if (ball.x < ball.radius) { ball.vx *= -0.5; ball.x = ball.radius; }
            if (ball.x > canvas.width - ball.radius) { ball.vx *= -0.5; ball.x = canvas.width - ball.radius; }
            if (ball.y < ball.radius) { ball.vy *= -0.4; ball.y = ball.radius; }

            const wallThicknessHalf = 4; 
            if (ball.y < laneExitY) {
                if (ball.x > laneX - 15 && ball.vx >= 0) { ball.vx = -7; ball.vy = -3; }
            } else {
                if (ball.x > laneX) {
                    if (ball.x < laneX + wallThicknessHalf + ball.radius) {
                        ball.x = laneX + wallThicknessHalf + ball.radius; ball.vx = Math.abs(ball.vx) * 0.5; 
                    }
                } else {
                    if (ball.x > laneX - wallThicknessHalf - ball.radius) {
                        ball.x = laneX - wallThicknessHalf - ball.radius; ball.vx = -Math.abs(ball.vx) * 0.5; 
                    }
                }
            }

            if (ball.holeTimer === 0) {
                bumpers.forEach(b => {
                    const dx = ball.x - b.x; const dy = ball.y - b.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < ball.radius + b.r) {
                        const angle = Math.atan2(dy, dx);
                        const jitter = (Math.random() - 0.5) * 0.1;
                        const bPower = 11.5;
                        ball.vx = Math.cos(angle + jitter) * bPower; 
                        ball.vy = Math.sin(angle + jitter) * bPower;
                        score += 10; scoreEl.innerText = `Score: ${score}`;
                        floatingTexts.push(new FloatingText(b.x, b.y - 20, `+10`));
                        ball.x = b.x + Math.cos(angle) * (ball.radius + b.r + 1);
                        b.scale = 1.3; playKeroSound(1.35); 
                    }
                });
                const slings = [
                    {x1: 0, y1: slingTop, x2: slingWidth, y2: flipY, isLeft: true},
                    {x1: laneX, y1: slingTop, x2: laneX - slingWidth, y2: flipY, isLeft: false}
                ];
                slings.forEach(s => {
                    if (ball.y >= slingTop && ball.y <= flipY) {
                        const progress = (ball.y - slingTop) / (flipY - slingTop);
                        const edgeX = s.isLeft ? (progress * slingWidth) : (laneX - (progress * slingWidth));
                        const isInside = s.isLeft ? (ball.x - ball.radius < edgeX) : (ball.x + ball.radius > edgeX && ball.x < laneX);
                        if (isInside) {
                            const speed = Math.sqrt(ball.vx**2 + ball.vy**2);
                            const bouncePower = Math.max(7, speed * 0.88); 
                            const angleJitter = (Math.random() - 0.5) * 0.2; 
                            if (s.isLeft) {
                                ball.vx = Math.cos(angleJitter) * bouncePower;
                                ball.vy = Math.sin(angleJitter) * bouncePower - 5;
                            } else {
                                ball.vx = -Math.cos(angleJitter) * bouncePower;
                                ball.vy = Math.sin(angleJitter) * bouncePower - 5;
                            }
                            score += 5; scoreEl.innerText = `Score: ${score}`;
                            floatingTexts.push(new FloatingText(ball.x, ball.y, `+5`));
                            ball.x = s.isLeft ? (edgeX + ball.radius + 2) : (edgeX - ball.radius - 2);
                            playKeroSound(1.1);
                        }
                    }
                });
            }
            [leftFlipper, rightFlipper].forEach(f => {
                f.update();
                if (ball.holeTimer > 0) return;
                const dx = ball.x - f.x; const dy = ball.y - f.y;
                const cos = Math.cos(-f.angle); const sin = Math.sin(-f.angle);
                const rx = dx * cos - dy * sin; const ry = dx * sin + dy * cos;
                const cosPrev = Math.cos(-f.prevAngle); const sinPrev = Math.sin(-f.prevAngle);
                const rxPrev = dx * cosPrev - dy * sinPrev;
                const rxOriented = rx * f.side;
                const rxPrevOriented = rxPrev * f.side;
                const isWithinLength = (rxOriented > -10 && rxOriented < f.length + 10) || (rxPrevOriented > -10 && rxPrevOriented < f.length + 10);
                if (isWithinLength) {
                    const isSwingingUp = (f.side === 1 && f.angularVelocity < -0.01) || (f.side === -1 && f.angularVelocity > 0.01);
                    let isHit = false; let isFrontHit = false;
                    const thicknessBound = ball.radius + flipperThickness / 2;
                    if (isSwingingUp) {
                        if (ry > -(thicknessBound + 2) && ry < thicknessBound + 45) { isHit = true; isFrontHit = true; }
                    } else {
                        if (Math.abs(ry) < thicknessBound + 2) { isHit = true; isFrontHit = (ry < 0); }
                    }
                    if (isHit) {
                        if (isFrontHit) {
                            if (Math.abs(f.angularVelocity) > 0.005) {
                                const dist = Math.max(0, Math.min(Math.abs(rx), f.length));
                                const hitPower = 24.5 * (0.65 + (dist / f.length) * 0.55); 
                                const bounceVyRel = -hitPower * 0.95; 
                                const bounceVxRel = 4 * f.side;
                                ball.vx = bounceVxRel * Math.cos(f.angle) - bounceVyRel * Math.sin(f.angle);
                                ball.vy = bounceVxRel * Math.sin(f.angle) + bounceVyRel * Math.cos(f.angle);
                                playKeroSound(0.9); 
                            } else { ball.vx *= 0.85; ball.vy *= 0.85; }
                            const pushY = -(thicknessBound + 1);
                            ball.x = f.x + (rx * Math.cos(f.angle) - pushY * Math.sin(f.angle));
                            ball.y = f.y + (rx * Math.sin(f.angle) + pushY * Math.cos(f.angle));
                        } else {
                            ball.vy = Math.abs(ball.vy) + gravity * 3 + 1.5; 
                            ball.vx += f.side * 1.0; 
                            const pushY = (thicknessBound + 2);
                            ball.x = f.x + (rx * Math.cos(f.angle) - pushY * Math.sin(f.angle));
                            ball.y = f.y + (rx * Math.sin(f.angle) + pushY * Math.cos(f.angle));
                        }
                    }
                }
            });
            if (ball.y > canvas.height + 100) {
                score = 0; scoreEl.innerText = `Score: ${score}`;
                resetBall(); playKeroSound(0.65); 
            }
            draw();
            requestAnimationFrame(update);
        }

        window.addEventListener('keydown', e => {
            enableSound(); 
            if (e.code === 'Space') plunger.isCharging = true;
            if (e.code === 'ArrowLeft' || e.code === 'KeyZ') leftFlipper.targetAngle = -0.6;
            if (e.code === 'ArrowRight' || e.code === 'KeyM') rightFlipper.targetAngle = 0.6;
        });
        window.addEventListener('keyup', e => {
            if (e.code === 'Space') plunger.isCharging = false;
            if (e.code === 'ArrowLeft' || e.code === 'KeyZ') leftFlipper.targetAngle = 0.6;
            if (e.code === 'ArrowRight' || e.code === 'KeyM') rightFlipper.targetAngle = -0.6;
        });
        canvas.addEventListener('touchstart', e => {
            e.preventDefault(); enableSound(); 
            const rect = canvas.getBoundingClientRect();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const tx = (e.changedTouches[i].clientX - rect.left) * (canvas.width / rect.width);
                if (tx > laneX - 40) plunger.isCharging = true;
                else {
                    if (tx < canvas.width / 2) leftFlipper.targetAngle = -0.6;
                    else rightFlipper.targetAngle = 0.6;
                }
            }
        }, {passive: false});
        canvas.addEventListener('touchend', e => {
            e.preventDefault(); plunger.isCharging = false;
            leftFlipper.targetAngle = 0.6; rightFlipper.targetAngle = -0.6;
        }, {passive: false});

        resetBall();
        update();
    </script>
</body>
</html>
